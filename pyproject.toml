[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handglyph"
# ⚠️ 必须与 handglyph.py 里的 __version__ 一致（pack.py 会在打包时核对并告警）。
version = "0.7.0"
description = "用你自己的手写字生成手写风图片：从手写照片建字形库，再用本人真实笔画渲染文字。非字体渲染、全程离线、不用 AI 模型。Text-to-handwriting generator, offline, no AI model."
# PyPI 页面用仓库的 README.md 渲染（含中英对照简介与免责声明）。
readme = "README.md"
requires-python = ">=3.9"
# keywords 是 PyPI 检索与工具发现的主要抓手，尽量覆盖同义与场景词。
keywords = [
    "handwriting",
    "handwriting-generation",
    "text-to-handwriting",
    "handwriting-synthesis",
    "handwriting-simulation",
    "text-to-image",
    "image-generation",
    "glyph",
    "offline",
    "local-first",
    "privacy",
    "chinese-handwriting",
    "no-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing",
]
# 三个核心依赖，缺一不可。
# 注意：OCR 刻意不列为依赖 —— 它只服务 extract 这一个便利功能，
# 且还需要额外安装程序本体与语言包，装了会让安装门槛陡增。
dependencies = [
    "pillow>=9",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# 想用 OCR 自动提取文字时再装（二选一）：
#   pip install handglyph[ocr]       tesseract 后端（轻量，需另装 tesseract 程序本体）
#   pip install handglyph[ocr-pp]    PaddleOCR 后端（中文识别更准，但 paddlepaddle 有数百 MB）
ocr = ["pytesseract"]
ocr-pp = ["paddleocr", "paddlepaddle"]

[project.scripts]
handglyph = "handglyph:main"

[project.urls]
Homepage = "https://github.com/jiangyonghan760/handglyph"
Repository = "https://github.com/jiangyonghan760/handglyph"
Issues = "https://github.com/jiangyonghan760/handglyph/issues"
Changelog = "https://github.com/jiangyonghan760/handglyph/releases"

[tool.setuptools]
py-modules = ["handglyph"]
